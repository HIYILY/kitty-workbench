<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kitty 工作台</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#ff9ec4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="kitty-wrap" id="kitty" title="点我打招呼～">
      <svg class="kitty" viewBox="0 0 220 200">
        <path d="M46 80 Q30 20 64 50 L92 74 Z" fill="#fffaf4" stroke="#5a3a2e" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M174 80 Q190 20 156 50 L128 74 Z" fill="#fffaf4" stroke="#5a3a2e" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M60 72 Q50 42 70 58 L84 72 Z" fill="#ffb8d4"/>
        <path d="M160 72 Q170 42 150 58 L136 72 Z" fill="#ffb8d4"/>
        <ellipse cx="110" cy="112" rx="86" ry="74" fill="#fffaf4" stroke="#5a3a2e" stroke-width="3.5"/>
        <ellipse cx="78" cy="110" rx="14" ry="18" fill="#3a2a24"/>
        <ellipse cx="142" cy="110" rx="14" ry="18" fill="#3a2a24"/>
        <circle cx="73" cy="103" r="5.5" fill="#fff"/>
        <circle cx="137" cy="103" r="5.5" fill="#fff"/>
        <circle cx="83" cy="117" r="3" fill="#fff"/>
        <circle cx="147" cy="117" r="3" fill="#fff"/>
        <ellipse cx="54" cy="134" rx="13" ry="8" fill="#ffb8d4" opacity="0.75"/>
        <ellipse cx="166" cy="134" rx="13" ry="8" fill="#ffb8d4" opacity="0.75"/>
        <path d="M110 124 L103 132 L117 132 Z" fill="#ff8fb8"/>
        <path d="M110 132 Q102 142 94 134" fill="none" stroke="#5a3a2e" stroke-width="3" stroke-linecap="round"/>
        <path d="M110 132 Q118 142 126 134" fill="none" stroke="#5a3a2e" stroke-width="3" stroke-linecap="round"/>
        <g stroke="#5a3a2e" stroke-width="3" stroke-linecap="round" opacity="0.85">
          <line x1="22" y1="108" x2="58" y2="112"/>
          <line x1="20" y1="126" x2="58" y2="124"/>
          <line x1="198" y1="108" x2="162" y2="112"/>
          <line x1="200" y1="126" x2="162" y2="124"/>
        </g>
        <g transform="translate(172,56) rotate(16)">
          <path d="M0 0 Q-24 -18 -24 0 Q-24 18 0 0 Z" fill="#ff8fb8" stroke="#5a3a2e" stroke-width="3" stroke-linejoin="round"/>
          <path d="M0 0 Q24 -18 24 0 Q24 18 0 0 Z" fill="#ff8fb8" stroke="#5a3a2e" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="8" fill="#ff6ba8" stroke="#5a3a2e" stroke-width="3"/>
        </g>
      </svg>
      <div class="bubble hidden" id="kittyBubble"></div>
    </div>
    <div class="header-text">
      <h1 id="appTitle" class="app-title" title="点击可改名字">Kitty 工作台</h1>
      <div class="today-info" id="todayInfo"></div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="home">首页</button>
    <button class="tab" data-tab="schedule">课程表</button>
    <button class="tab" data-tab="countdown">倒计时</button>
  </nav>

  <main>
    <!-- 首页 -->
    <section id="tab-home" class="tab-panel active">
      <div class="todo-input">
        <button id="voiceBtn" class="voice-btn" title="点击语音录入">🎤</button>
        <input id="todoText" type="text" placeholder="说：后天下午3点交作业">
        <button id="addBtn" class="add-btn">添加</button>
      </div>
      <div id="voiceStatus" class="voice-status hidden"></div>
      <div class="todo-filter">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="pending">未完成</button>
        <button class="chip" data-filter="done">已完成</button>
      </div>
      <ul id="todoList" class="todo-list"></ul>

      <div class="bottom-row">
        <!-- 左下：饮水计划 -->
        <div class="card water-card">
          <h2>💧 饮水计划</h2>
          <div class="water-track" id="waterTrack"></div>
          <div class="water-info"><span id="waterText">0 / 8 杯</span> · <span id="waterMl">0 ml</span></div>
          <div class="water-actions">
            <button id="waterMinus" class="mini">−</button>
            <button id="waterPlus" class="mini pink">+ 一杯</button>
          </div>
        </div>

        <!-- 右下：运动计划 -->
        <div class="card exercise-card">
          <h2>🏃 运动计划</h2>
          <div class="ex-total">今日消耗 <b id="exTotal">0</b> 千卡</div>
          <div class="ex-row">
            <select id="exType" class="mini-field"></select>
            <input id="exMin" type="number" inputmode="numeric" min="1" placeholder="分钟" class="mini-field ex-min">
          </div>
          <div class="ex-row">
            <label class="mini-label">体重 <input id="exWeight" type="number" inputmode="numeric" min="20" class="mini-field ex-w"> kg</label>
            <span id="exKcal" class="ex-kcal">≈ 0 千卡</span>
          </div>
          <button id="exAdd" class="mini pink full">+ 记录这次运动</button>
          <ul id="exList" class="ex-list"></ul>
        </div>
      </div>
    </section>

    <!-- 课程表 -->
    <section id="tab-schedule" class="tab-panel">
      <details class="time-config">
        <summary>⚙️ 课程时间设置（可自己调每节课时间）</summary>
        <div id="periodEditor" class="period-editor"></div>
        <button id="addPeriod" class="mini pink">+ 添加一节</button>
        <div class="hint">改完时间后，课程表与上课提醒会自动按新时间计算。</div>
      </details>
      <div class="hint">点击格子编辑课程；今天所在列高亮。</div>
      <div class="schedule-wrap" id="scheduleWrap"></div>
    </section>

    <!-- 倒计时 -->
    <section id="tab-countdown" class="tab-panel">
      <div class="card">
        <h2>📚 学期进度</h2>
        <div class="semester-config">
          <label>开学 <input type="date" id="semStart"></label>
          <label>放假 <input type="date" id="semEnd"></label>
        </div>
        <div id="semesterInfo"></div>
      </div>
      <div class="card">
        <h2>🎉 周末倒计时</h2>
        <div id="weekendInfo" class="big-count"></div>
      </div>
      <div class="card">
        <h2>🏖️ 放假倒计时</h2>
        <ul id="holidayList" class="count-list"></ul>
      </div>
      <div class="card">
        <h2>🔁 调休提醒</h2>
        <ul id="makeupList" class="count-list"></ul>
        <div class="hint">放假与调休以国务院公布为准，可在 app.js 的 HOLIDAYS / MAKEUP 中调整。</div>
      </div>
    </section>
  </main>

  <!-- 课程编辑弹窗 -->
  <div id="courseModal" class="modal hidden">
    <div class="modal-body">
      <h3 id="courseModalTitle">编辑课程</h3>
      <input id="courseName" class="field" placeholder="课程名，如：高等数学">
      <input id="courseLoc" class="field" placeholder="地点（可选），如：一教201">
      <div class="modal-actions">
        <button id="courseClear" class="btn danger">删除</button>
        <span class="spacer"></span>
        <button id="courseCancel" class="btn">取消</button>
        <button id="courseSave" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
